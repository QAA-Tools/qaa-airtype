<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无线键盘</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 12px 20px 20px;
            text-align: center;
            background-color: #f5f5f7;
            color: #333;
        }
        h2 { margin-bottom: 12px; font-weight: 600; }
        .control-bar {
            display: flex; justify-content: flex-end; gap: 8px; align-items: center;
            font-size: 12px; margin-bottom: 8px; color: #666;
        }
        .control-bar select {
            padding: 4px 8px; border-radius: 8px; border: 1px solid #d1d1d6;
            background: #fff; font-size: 12px;
        }
        .input-group { margin-bottom: 15px; }
        textarea {
            width: 100%; padding: 12px 15px; font-size: 14px; border-radius: 12px;
            border: 1px solid #d1d1d6; box-sizing: border-box; outline: none;
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
            min-height: 160px; max-height: 60vh; resize: vertical; line-height: 1.5;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        textarea:focus { border-color: #007AFF; }
        .button-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 15px; font-size: 18px; color: white;
            border: none; border-radius: 12px; cursor: pointer; font-weight: 600;
            transition: background-color 0.1s, transform 0.1s;
        }
        button#sendBtn {
            background-color: #007AFF;
            box-shadow: 0 4px 6px rgba(0,122,255,0.2);
        }
        button#sendBtn:active { background-color: #0056b3; transform: scale(0.98); }
        button#clearBtn {
            background-color: #8e8e93;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button#clearBtn:active { background-color: #636366; transform: scale(0.98); }
        #status { margin-top: 10px; height: 20px; font-size: 14px; color: #34c759; font-weight: 500;}
        .history-container { margin-top: 30px; text-align: left; }
        .history-header {
            font-size: 14px; color: #888; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .clear-btn { color: #ff3b30; cursor: pointer; font-size: 12px; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid #e5e5ea; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            transition: background 0.1s;
        }
        .history-item:active { background: #f0f0f0; }
        .history-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 85%; font-size: 14px;
        }
        .history-arrow { color: #c7c7cc; font-size: 18px; }
    </style>
</head>
<body>
    <h2>电脑远程输入板</h2>
    <div class="control-bar">
        <span>输入框大小</span>
        <select id="heightSelect">
            <option value="xsmall">特小</option>
            <option value="small">小</option>
            <option value="medium" selected>中</option>
            <option value="large">大</option>
            <option value="xlarge">特大</option>
        </select>
        <span>字号</span>
        <select id="fontSizeSelect">
            <option value="12">特小</option>
            <option value="14">小</option>
            <option value="16" selected>中</option>
            <option value="18">大</option>
            <option value="20">特大</option>
        </select>
    </div>
    <div class="input-group">
        <textarea id="textInput" placeholder="输入文字..." autofocus autocomplete="off"></textarea>
    </div>
    <div class="button-group">
        <button id="clearBtn" onclick="handleClear()">清空</button>
        <button id="sendBtn" onclick="handleSend()">发送 (Ent)</button>
    </div>
    <div id="status"></div>
    <div class="history-container">
        <div class="history-header">
            <span>最近记录 (点击重发)</span>
            <span class="clear-btn" onclick="clearHistory()">清空</span>
        </div>
        <ul id="historyList" class="history-list"></ul>
    </div>
    <script>
        const input = document.getElementById('textInput');
        const status = document.getElementById('status');
        const fontSizeSelect = document.getElementById('fontSizeSelect');
        const heightSelect = document.getElementById('heightSelect');
        const historyList = document.getElementById('historyList');
        const MAX_HISTORY = 10;
        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

        function applyFontSize() {
            const size = fontSizeSelect.value;
            input.style.fontSize = size + 'px';
        }

        function applyHeight() {
            const value = heightSelect.value;
            if (value === 'xsmall') {
                input.style.minHeight = '140px';
                input.style.maxHeight = '50vh';
            } else if (value === 'small') {
                input.style.minHeight = '180px';
                input.style.maxHeight = '60vh';
            } else if (value === 'medium') {
                input.style.minHeight = '220px';
                input.style.maxHeight = '65vh';
            } else if (value === 'large') {
                input.style.minHeight = '280px';
                input.style.maxHeight = '75vh';
            } else if (value === 'xlarge') {
                input.style.minHeight = '340px';
                input.style.maxHeight = '85vh';
            }
        }

        window.onload = function() {
            applyFontSize();
            applyHeight();
            renderHistory();
        }

        if (fontSizeSelect && heightSelect) {
            fontSizeSelect.addEventListener('change', applyFontSize);
            heightSelect.addEventListener('change', applyHeight);
        }

        input.addEventListener("keydown", function(event) {
            if (isMobile) return;
            if (event.key === "Enter") {
                if (event.shiftKey) return;
                event.preventDefault();
                handleSend();
            }
        });

        document.body.addEventListener('click', function(event) {
            const target = event.target;
            if (!target.closest('button') &&
                !target.closest('.history-item') &&
                !target.closest('.clear-btn') &&
                !target.closest('.control-bar') &&
                target !== input) {
                input.focus();
            }
        });
        function handleSend() {
            const text = input.value.trim();
            if (!text) return;
            saveToHistory(text);
            sendRequest(text);
        }
        function handleClear() {
            input.value = '';
            input.focus();
        }
        function sendRequest(text) {
            status.innerText = "发送中...";
            status.style.color = "#888";
            fetch('/type', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.innerText = "✓ 已发送";
                    status.style.color = "#34c759";
                    input.value = '';
                    setTimeout(() => status.innerText = "", 1500);
                } else { throw new Error("Server error"); }
            })
            .catch(err => {
                status.innerText = "✕ 发送失败";
                status.style.color = "#ff3b30";
            });
        }
        function getHistory() {
            const stored = localStorage.getItem('typeHistory');
            return stored ? JSON.parse(stored) : [];
        }
        function saveToHistory(text) {
            let history = getHistory();
            history = history.filter(item => item !== text);
            history.unshift(text);
            if (history.length > MAX_HISTORY) { history = history.slice(0, MAX_HISTORY); }
            localStorage.setItem('typeHistory', JSON.stringify(history));
            renderHistory();
        }
        function renderHistory() {
            const history = getHistory();
            historyList.innerHTML = '';
            history.forEach(text => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.onclick = () => { input.value = text; handleSend(); };
                li.innerHTML = `<span class="history-text">${escapeHtml(text)}</span><span class="history-arrow">⤶</span>`;
                historyList.appendChild(li);
            });
        }
        function clearHistory() { localStorage.removeItem('typeHistory'); renderHistory(); }
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
